<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#fff6e8"/>
      <stop offset="1" stop-color="#fcdbae"/>
    </radialGradient>
    <linearGradient id="body" x1="0" x2="1">
      <stop offset="0" stop-color="#eeb453"/>
      <stop offset=".45" stop-color="#fde3a4"/>
      <stop offset="1" stop-color="#e6a744"/>
    </linearGradient>
    <linearGradient id="caramel" x1="0" x2="1">
      <stop offset="0" stop-color="#b9500c"/>
      <stop offset=".45" stop-color="#e07a22"/>
      <stop offset="1" stop-color="#b4490a"/>
    </linearGradient>
    <linearGradient id="sauce" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a84c1c"/>
      <stop offset="1" stop-color="#7c3412"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- arch frame -->
  <g fill="none" stroke="#c99a52" stroke-linecap="round">
    <path d="M92 470V240a164 164 0 0 1 328 0v230" stroke-width="6"/>
    <path d="M108 470V242a148 148 0 0 1 296 0v228" stroke-width="2.5" opacity=".7"/>
  </g>

  <!-- sparkles -->
  <g fill="#c99a52">
    <path d="M58 132l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/>
    <path d="M454 132l7 17 17 7-17 7-7 17-7-17-17-7 17-7z"/>
  </g>

  <!-- plate -->
  <ellipse cx="256" cy="340" rx="156" ry="50" fill="#fffaf1" stroke="#e2c69c" stroke-width="4"/>
  <ellipse cx="256" cy="340" rx="128" ry="36" fill="none" stroke="#efdcbf" stroke-width="2"/>

  <!-- caramel puddle -->
  <path d="M128 330c-14 10-4 26 18 28 10 14 34 16 50 10 18 12 52 14 74 6 22 10 56 6 70-6 24 2 44-8 44-22 14-10 2-24-16-26-40-14-200-14-240 10z" fill="url(#sauce)"/>

  <!-- pudim body -->
  <path d="M140 320l20-94a96 28 0 0 1 192 0l20 94a116 30 0 0 1-232 0z" fill="url(#body)"/>
  <path d="M140 320a116 30 0 0 0 232 0" fill="none" stroke="#c98a32" stroke-width="3" opacity=".6"/>

  <!-- caramel top with drips -->
  <path d="M160 226a96 28 0 0 1 192 0l4 16c-6 10-14 6-18 0-4 14-16 16-22 4-8 10-22 10-32 2-10 8-28 8-36 0-8 8-24 8-30-2-6 12-20 12-24 0-6 6-16 4-34-6z" fill="url(#caramel)"/>
  <ellipse cx="256" cy="226" rx="96" ry="28" fill="#d76c1a"/>
  <ellipse cx="232" cy="217" rx="44" ry="8" fill="#f39a45" opacity=".55"/>

  <!-- center hole -->
  <ellipse cx="256" cy="227" rx="30" ry="10" fill="#f2c47a"/>
  <path d="M226 227a30 10 0 0 1 60 0z" fill="#7c3412"/>

  <!-- hearts -->
  <g fill="#4a2212">
    <path d="M118 264c-16-12-24-20-24-30 0-8 6-14 13-14 5 0 9 3 11 7 2-4 6-7 11-7 7 0 13 6 13 14 0 10-8 18-24 30z"/>
    <path d="M394 296c-16-12-24-20-24-30 0-8 6-14 13-14 5 0 9 3 11 7 2-4 6-7 11-7 7 0 13 6 13 14 0 10-8 18-24 30z"/>
  </g>

  <!-- heart at the base, as under the wordmark -->
  <path d="M256 448c-18-13-27-22-27-33 0-9 7-15 15-15 5 0 9 3 12 8 3-5 7-8 12-8 8 0 15 6 15 15 0 11-9 20-27 33z" fill="#e3a94a"/>
</svg>
